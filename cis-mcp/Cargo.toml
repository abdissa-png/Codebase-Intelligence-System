[package]
name = "cis-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP server for CIS (FR-4) — JSON-RPC stdio transport; hosts cisd --mcp"

[lib]
name = "cis_mcp"
path = "src/lib.rs"

[features]
default = ["fs-notify"]
# Native inotify/kqueue FS watch (Phase 2); disable with `CIS_FS_POLL_ONLY=1` at runtime.
fs-notify = ["cis-core/fs-notify"]
# Enable richer Python ingest (classes/methods + call extraction) via cis-core tree-sitter path.
python-ast = ["cis-core/tree-sitter"]
# Phase 6 — external HTTP embedding API (OpenAI-compatible).
api-embeddings = ["cis-core/api-embeddings"]
# Phase 8 — SQLite body/metadata backends for migration tools.
body-sqlite = ["cis-core/body-sqlite"]

[dependencies]
cis-core = { path = "../cis-core", default-features = false }
cis-wal = { path = "../cis-wal" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "cis"
path = "src/bin/cis.rs"
required-features = ["body-sqlite"]

[[bin]]
name = "cis-mcp"
path = "src/bin/cis-mcp.rs"

[[bin]]
name = "cisd"
path = "src/bin/cisd.rs"

[[bin]]
name = "cis-embed-smoke"
path = "src/bin/cis-embed-smoke.rs"
required-features = ["api-embeddings"]
