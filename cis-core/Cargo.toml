[package]
name = "cis-core"
version = "0.1.0"
edition = "2021"
description = "CIS graph, KV, coordinator, recovery (Architecture v2.6)"

[features]
default = []
# Shared tree-sitter runtime (Parser + span helpers). Enabled by any language feature.
ts-runtime = ["dep:tree-sitter"]
# FR-1.1 — native Python defs via Tree-sitter (`.cis/grammar.lock`); default path stays regex.
tree-sitter = ["ts-runtime", "dep:tree-sitter-python"]
# Per-language tree-sitter grammars (each brings in the core tree-sitter dep).
ts-rust = ["ts-runtime", "dep:tree-sitter-rust"]
ts-go = ["ts-runtime", "dep:tree-sitter-go"]
ts-javascript = ["ts-runtime", "dep:tree-sitter-javascript"]
ts-typescript = ["ts-runtime", "dep:tree-sitter-typescript"]
ts-java = ["ts-runtime", "dep:tree-sitter-java"]
ts-c = ["ts-runtime", "dep:tree-sitter-c"]
ts-cpp = ["ts-runtime", "dep:tree-sitter-cpp"]
ts-csharp = ["ts-runtime", "dep:tree-sitter-c-sharp"]
# Meta-feature: enable tree-sitter indexing for all supported languages.
tree-sitter-all = [
    "tree-sitter", "ts-rust", "ts-go", "ts-javascript", "ts-typescript",
    "ts-java", "ts-c", "ts-cpp", "ts-csharp",
]
# Phase 2 — inotify/kqueue FS watch (falls back to mtime polling when disabled).
fs-notify = ["dep:notify"]
# Phase 6 — external HTTP embedding API (OpenAI-compatible `/v1/embeddings`).
api-embeddings = ["dep:minreq"]
# Phase 7 — optional SQLite body blob backend (default: files under `.cis/bodies/`).
body-sqlite = ["dep:rusqlite"]
# Test-only alias (dev-dependencies cannot enable optional deps directly in all cases).
test-body-sqlite = ["body-sqlite"]

[dependencies]
cis-wal = { path = "../cis-wal" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.8.26"
thiserror = "1"
regex = "1"
diffy = "0.4"
tree-sitter = { version = "0.24", optional = true }
tree-sitter-python = { version = "0.23", optional = true }
tree-sitter-rust = { version = "0.23", optional = true }
tree-sitter-go = { version = "0.23", optional = true }
tree-sitter-javascript = { version = "0.23", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
tree-sitter-c = { version = "0.23", optional = true }
tree-sitter-cpp = { version = "0.23", optional = true }
# Pin 0.23.1: 0.23.5 ships ABI 15 which tree-sitter 0.24 rejects (max ABI 14).
tree-sitter-c-sharp = { version = "=0.23.1", optional = true }
notify = { version = "6", optional = true }
minreq = { version = "=2.7.0", optional = true, features = ["https-rustls"] }
rusqlite = { version = "0.32", optional = true, features = ["bundled"] }
libc = "0.2"

[dev-dependencies]
tempfile = "=3.13"
